<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isolated Loop Station & Synth Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
    <style>
        :root {
            --bg-color: #020202;
            --panel-bg: #090909;
            --accent-red: #cc1111;
            --accent-yellow: #cc9900;
            --text-main: #e0e0e0;
            --text-muted: #666666;
            --border-color: #161616;
            --ui-scale: 1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: monospace; font-weight: 300; background-color: var(--bg-color);
            color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; padding: calc(4px * var(--ui-scale)); overflow-x: hidden;
            font-size: calc(10px * var(--ui-scale));
        }
        #top-banner {
            width: 100%; height: calc(24px * var(--ui-scale)); background-color: #0d0d0d; border: 1px solid var(--border-color);
            border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: calc(10px * var(--ui-scale));
            color: var(--accent-yellow); margin-bottom: calc(4px * var(--ui-scale)); flex-shrink: 0;
        }
        #spectrometer-bar {
            width: 100%; height: calc(130px * var(--ui-scale)); background-color: var(--panel-bg);
            border: 1px solid var(--border-color); border-radius: 4px; display: flex; align-items: center; padding: 0 calc(8px * var(--ui-scale)); gap: calc(10px * var(--ui-scale)); flex-shrink: 0; margin-bottom: calc(4px * var(--ui-scale));
        }
        .canvas-container {
            position: relative; flex-grow: 1; height: calc(110px * var(--ui-scale)); display: flex; flex-direction: column; cursor: crosshair;
        }
        canvas { width: 100%; height: calc(90px * var(--ui-scale)); background: #000; border: 1px solid var(--border-color); }
        .axis-labels-x {
            display: flex; justify-content: space-between; font-size: calc(8px * var(--ui-scale)); color: var(--text-muted); padding: 2px 0;
        }
        .axis-labels-y {
            position: absolute; right: 2px; top: 16px; bottom: 22px; display: flex; flex-direction: column; justify-content: space-between; font-size: calc(8px * var(--ui-scale)); color: var(--text-muted); pointer-events: none; text-align: right;
        }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(280px * var(--ui-scale)), 1fr)); gap: calc(4px * var(--ui-scale)); flex-grow: 1; width: 100%; }
        .panel {
            background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 4px;
            padding: calc(6px * var(--ui-scale)); display: flex; flex-direction: column; gap: calc(4px * var(--ui-scale)); min-height: calc(180px * var(--ui-scale)); overflow: hidden;
        }
        .panel-header {
            font-size: calc(11px * var(--ui-scale)); font-weight: 300; color: var(--accent-yellow); display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: calc(2px * var(--ui-scale));
        }
        button {
            background-color: var(--accent-red); color: #000; border: none; padding: calc(2px * var(--ui-scale)) calc(6px * var(--ui-scale));
            font-size: calc(10px * var(--ui-scale)); font-family: monospace; cursor: pointer; border-radius: 2px; display: inline-flex; align-items: center; gap: calc(4px * var(--ui-scale));
        }
        button:hover { background-color: var(--accent-yellow); }
        button.secondary { background-color: #0d0d0d; color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
        input, select { background: #000; border: 1px solid var(--border-color); color: var(--text-main); font-family: monospace; font-size: calc(10px * var(--ui-scale)); padding: calc(2px * var(--ui-scale)); border-radius: 2px; }
        input[type="range"] { accent-color: var(--accent-red); height: calc(12px * var(--ui-scale)); }
        #tone-list, .takes-container, #markers-list { overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: calc(3px * var(--ui-scale)); flex-grow: 1; max-height: calc(150px * var(--ui-scale)); width: 100%; }
        .tone-row { display: grid; grid-template-columns: calc(50px * var(--ui-scale)) 1fr calc(60px * var(--ui-scale)) calc(45px * var(--ui-scale)) calc(35px * var(--ui-scale)); gap: calc(2px * var(--ui-scale)); align-items: center; background: #000; padding: calc(2px * var(--ui-scale)); border: 1px solid var(--border-color); font-size: calc(9px * var(--ui-scale)); width: 100%; overflow: hidden; }
        .freq-box { display: flex; flex-direction: column; min-width: 0; }
        .take-row, .marker-row { display: flex; justify-content: space-between; align-items: center; background: #000; padding: calc(2px * var(--ui-scale)) calc(4px * var(--ui-scale)); border: 1px solid var(--border-color); font-size: calc(10px * var(--ui-scale)); width: 100%; overflow: hidden; }
        .take-info, .marker-info { display: flex; align-items: center; gap: calc(6px * var(--ui-scale)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .take-timer { font-family: monospace; color: var(--text-muted); font-size: calc(9px * var(--ui-scale)); }
        .compact-group { display: flex; gap: calc(4px * var(--ui-scale)); align-items: center; flex-shrink: 0; }
        .icon { width: calc(12px * var(--ui-scale)); height: calc(12px * var(--ui-scale)); stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; display: inline-block; }
    </style>
</head>
<body>
    <div id="top-banner">System Ready. Click any control to begin.</div>

    <div id="spectrometer-bar">
        <div class="compact-group" style="flex-direction: column; align-items: flex-start; gap: calc(2px * var(--ui-scale));">
            <button id="master-toggle" class="secondary" title="Init Audio"><svg class="icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg></button>
            <button id="mic-toggle-btn" class="secondary" title="Microphone"><svg class="icon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg></button>
            <button id="play-all-tones-btn" class="secondary" style="border-color:var(--accent-yellow); color:var(--accent-yellow);" title="Play All"><svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></button>
            <button id="stop-all-tones-btn" class="secondary" style="border-color:var(--accent-red); color:var(--accent-red);" title="Stop All"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg></button>
        </div>
        <div style="display:flex; flex-direction:column; flex-grow:1; gap:calc(2px * var(--ui-scale));">
            <div style="display:flex; justify-content:space-between; font-size:calc(9px * var(--ui-scale)); color:var(--text-muted);">
                <span id="fft-info-label">FFT: 8192 | RANGE: 0Hz - 30kHz</span>
                <span id="peak-freq-display">PEAK: 0.00 Hz</span>
            </div>
            <div class="canvas-container" id="canvas-container">
                <canvas id="analyzer-canvas"></canvas>
                <div class="axis-labels-y">
                    <span>0 dB</span>
                    <span>-30 dB</span>
                    <span>-60 dB</span>
                    <span>-90 dB</span>
                </div>
                <div class="axis-labels-x">
                    <span>0 Hz</span>
                    <span>7.5 kHz</span>
                    <span>15 kHz</span>
                    <span>22.5 kHz</span>
                    <span>30 kHz</span>
                </div>
            </div>
        </div>
        <div class="compact-group" style="flex-direction: column; align-items: flex-end; gap: calc(4px * var(--ui-scale));">
            <div class="compact-group">
                <button id="zoom-out-btn" class="secondary" title="Decrease UI Size"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg></button>
                <button id="zoom-in-btn" class="secondary" title="Increase UI Size"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg></button>
                <button id="save-preset-btn" class="secondary" title="Save Session & Export MP3s"><svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg></button>
                <button id="load-preset-btn" class="secondary" title="Load Session"><svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg></button>
                <input type="file" id="load-file-input" style="display: none;">
            </div>
            <div class="compact-group">
                <label style="font-size:calc(9px * var(--ui-scale)); color:var(--text-muted)"><svg class="icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon></svg></label>
                <input type="range" id="master-volume" min="0" max="1" step="0.01" value="0.5" style="width: calc(70px * var(--ui-scale));">
            </div>
        </div>
    </div>

    <div class="dashboard">
        <div class="panel">
            <div class="panel-header">
                <span><svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg> TONES</span>
                <div class="compact-group">
                    <button id="play-all-sound-btn" class="secondary" style="border-color:var(--accent-yellow); color:var(--accent-yellow);" title="Play All Sounds"><svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg> Play All</button>
                    <button id="add-tone-btn"><svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> Add</button>
                </div>
            </div>
            <div id="tone-list"></div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span><svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> MARKERS</span>
                <button id="clear-markers-btn" class="secondary" style="border-color:var(--accent-red); color:var(--accent-red);"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> Clear</button>
            </div>
            <div id="markers-list" class="takes-container">
                <div style="color: var(--text-muted); font-size:calc(9px * var(--ui-scale)); text-align:center; margin-top:10px;">No spectrometer markers placed.</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span><svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg> SYNTH LOOPS</span>
                <button id="rec-take-btn"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3" fill="currentColor"></circle></svg> Rec</button>
            </div>
            <div id="synth-takes-list" class="takes-container">
                <div style="color: var(--text-muted); font-size:calc(9px * var(--ui-scale)); text-align:center; margin-top:10px;">No synth takes recorded.</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span><svg class="icon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path></svg> MIC LOOPS (320K)</span>
                <button id="rec-mic-take-btn"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3" fill="currentColor"></circle></svg> Rec Mic</button>
            </div>
            <div id="mic-takes-list" class="takes-container">
                <div style="color: var(--text-muted); font-size:calc(9px * var(--ui-scale)); text-align:center; margin-top:10px;">No mic takes recorded.</div>
            </div>
        </div>
    </div>

    <script>
        let audioCtx = null, masterGain = null, synthBus = null, loopBus = null, analyser = null, isAudioInit = false;
        let tones = [];
        let markers = [];
        let micStream = null, micSource = null, micAnalyser = null, isMicActive = false;
        let uiScale = 1.0;

        let synthMediaRecorder = null, synthRecordedChunks = [], synthTakes = [];
        let micMediaRecorder = null, micRecordedChunks = [], micTakes = [];
        let activeLoopElements = [];

        const topBanner = document.getElementById('top-banner');
        const masterToggle = document.getElementById('master-toggle');
        const stopAllTonesBtn = document.getElementById('stop-all-tones-btn');
        const playAllTonesBtn = document.getElementById('play-all-tones-btn');
        const playAllSoundBtn = document.getElementById('play-all-sound-btn');
        const masterVolume = document.getElementById('master-volume');
        const toneList = document.getElementById('tone-list');
        const addToneBtn = document.getElementById('add-tone-btn');
        const markersList = document.getElementById('markers-list');
        const clearMarkersBtn = document.getElementById('clear-markers-btn');
        const micToggleBtn = document.getElementById('mic-toggle-btn');
        const recTakeBtn = document.getElementById('rec-take-btn');
        const synthTakesList = document.getElementById('synth-takes-list');
        const recMicTakeBtn = document.getElementById('rec-mic-take-btn');
        const micTakesList = document.getElementById('mic-takes-list');
        const canvas = document.getElementById('analyzer-canvas');
        const canvasContainer = document.getElementById('canvas-container');
        const canvasCtx = canvas.getContext('2d');
        const peakFreqDisplay = document.getElementById('peak-freq-display');
        const fftInfoLabel = document.getElementById('fft-info-label');
        const savePresetBtn = document.getElementById('save-preset-btn');
        const loadPresetBtn = document.getElementById('load-preset-btn');
        const loadFileInput = document.getElementById('load-file-input');
        const zoomInBtn = document.getElementById('zoom-in-btn');
        const zoomOutBtn = document.getElementById('zoom-out-btn');

        function logAction(msg) {
            topBanner.textContent = msg;
        }

        zoomInBtn.addEventListener('click', () => {
            uiScale = Math.min(1.8, uiScale + 0.1);
            document.documentElement.style.setProperty('--ui-scale', uiScale);
            logAction(`Increased UI interface elements size to ${uiScale.toFixed(1)}x`);
        });

        zoomOutBtn.addEventListener('click', () => {
            uiScale = Math.max(0.6, uiScale - 0.1);
            document.documentElement.style.setProperty('--ui-scale', uiScale);
            logAction(`Decreased UI interface elements size to ${uiScale.toFixed(1)}x`);
        });

        window.addEventListener('DOMContentLoaded', () => {
            addToneRow(416, 'sine', 0.2, false);
            updateMasterToggleUI();
        });

        function initAudioContext() {
            if (isAudioInit) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext({ sampleRate: 96000 });

            masterGain = audioCtx.createGain();
            masterGain.gain.value = parseFloat(masterVolume.value);

            synthBus = audioCtx.createGain();
            synthBus.gain.value = 1.0;
            synthBus.connect(masterGain);

            loopBus = audioCtx.createGain();
            loopBus.gain.value = 1.0;
            loopBus.connect(masterGain);

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 8192;
            analyser.smoothingTimeConstant = 0.8;

            masterGain.connect(analyser);
            analyser.connect(audioCtx.destination);

            isAudioInit = true;
            updateMasterToggleUI();
            fftInfoLabel.textContent = `FFT: ${analyser.fftSize} | SR: ${audioCtx.sampleRate}Hz`;

            if (tones.length > 0 && !tones[0].isPlaying) {
                tones[0].start();
            }

            drawVisualizer();
        }

        function updateMasterToggleUI() {
            if (!isAudioInit) {
                masterToggle.style.borderColor = 'var(--border-color)';
                masterToggle.style.color = 'var(--text-muted)';
                masterToggle.style.backgroundColor = '#0d0d0d';
            } else if (audioCtx.state === 'running') {
                masterToggle.style.borderColor = 'var(--accent-red)';
                masterToggle.style.color = 'var(--accent-red)';
                masterToggle.style.backgroundColor = '#0d0d0d';
            } else if (audioCtx.state === 'suspended') {
                masterToggle.style.borderColor = 'var(--accent-yellow)';
                masterToggle.style.color = 'var(--accent-yellow)';
                masterToggle.style.backgroundColor = '#0d0d0d';
            }
        }

        masterToggle.addEventListener('click', () => {
            if (!isAudioInit) {
                initAudioContext();
                logAction('Initialized Master Audio Context');
            } else if (audioCtx.state === 'suspended') { 
                audioCtx.resume().then(() => updateMasterToggleUI()); 
                logAction('Resumed Audio Context');
            } else if (audioCtx.state === 'running') { 
                audioCtx.suspend().then(() => updateMasterToggleUI()); 
                logAction('Suspended Audio Context');
            }
            updateMasterToggleUI();
        });

        stopAllTonesBtn.addEventListener('click', () => { 
            tones.forEach(t => t.stop()); 
            activeLoopElements.forEach(item => {
                item.audio.pause();
                item.audio.currentTime = 0;
                item.playBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
                item.playBtn.style.color = 'var(--accent-yellow)';
                item.timer.textContent = formatTime(item.audio.duration || 0);
            });
            logAction('Stopped all active sounds');
        });

        playAllTonesBtn.addEventListener('click', () => {
            if(!isAudioInit) initAudioContext();
            tones.forEach(t => t.start());
            logAction('Played all tone generators');
        });

        playAllSoundBtn.addEventListener('click', () => {
            if(!isAudioInit) initAudioContext();
            tones.forEach(t => t.start());
            activeLoopElements.forEach(item => {
                if(item.audio.paused) {
                    if (!item.sourceNode && audioCtx) {
                        item.sourceNode = audioCtx.createMediaElementSource(item.audio);
                        item.sourceNode.connect(loopBus);
                    }
                    item.audio.play();
                    item.playBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>';
                    item.playBtn.style.color = 'var(--accent-red)';
                }
            });
            logAction('Played all tones and loops');
        });

        masterVolume.addEventListener('input', (e) => {
            if (masterGain) masterGain.gain.setValueAtTime(parseFloat(e.target.value), audioCtx.currentTime);
            logAction(`Changed master volume to ${Math.round(e.target.value * 100)}%`);
        });

        savePresetBtn.addEventListener('click', async () => {
            if(!isAudioInit) initAudioContext();
            const data = {
                volume: masterVolume.value,
                tones: tones.map(t => ({ freq: t.freq, type: t.type, gain: t.gainVal, playing: t.isPlaying })),
                synthTakes: synthTakes.map(st => ({ name: st.name, dataUrl: st.dataUrl })),
                micTakes: micTakes.map(mt => ({ name: mt.name, dataUrl: mt.dataUrl }))
            };
            const sessionBlob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/octet-stream' });
            const sessionUrl = URL.createObjectURL(sessionBlob);
            const aSession = document.createElement('a');
            aSession.href = sessionUrl;
            aSession.download = 'synthsession.synthsession';
            aSession.click();
            URL.revokeObjectURL(sessionUrl);

            for (let i = 0; i < synthTakes.length; i++) {
                await exportDataUrlAsMp3(synthTakes[i].dataUrl, `synth-take-${i + 1}.mp3`);
            }
            for (let i = 0; i < micTakes.length; i++) {
                await exportDataUrlAsMp3(micTakes[i].dataUrl, `mic-take-${i + 1}.mp3`);
            }
            logAction('Saved session and exported all audio takes as MP3 files');
        });

        loadPresetBtn.addEventListener('click', () => {
            loadFileInput.click();
            logAction('Opened file dialog to load preset session');
        });

        loadFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    if (!isAudioInit) initAudioContext();
                    masterVolume.value = data.volume || 0.5;
                    if (masterGain) masterGain.gain.setValueAtTime(parseFloat(masterVolume.value), audioCtx.currentTime);

                    tones.forEach(t => t.stop());
                    tones = [];
                    toneList.innerHTML = '';
                    if (data.tones && Array.isArray(data.tones)) {
                        data.tones.forEach(item => addToneRow(item.freq, item.type, item.gain, item.playing));
                    }

                    synthTakes = [];
                    activeLoopElements = activeLoopElements.filter(el => !el.isSynth);
                    synthTakesList.innerHTML = `<div style="color: var(--text-muted); font-size:calc(9px * var(--ui-scale)); text-align:center; margin-top:10px;">No synth takes recorded.</div>`;
                    if (data.synthTakes && Array.isArray(data.synthTakes)) {
                        data.synthTakes.forEach(st => addTakeUI(st.dataUrl, synthTakes, synthTakesList, 'Synth Take', true));
                    }

                    micTakes = [];
                    activeLoopElements = activeLoopElements.filter(el => el.isSynth);
                    micTakesList.innerHTML = `<div style="color: var(--text-muted); font-size:calc(9px * var(--ui-scale)); text-align:center; margin-top:10px;">No mic takes recorded.</div>`;
                    if (data.micTakes && Array.isArray(data.micTakes)) {
                        data.micTakes.forEach(mt => addTakeUI(mt.dataUrl, micTakes, micTakesList, 'Mic Take', false));
                    }
                    logAction(`Successfully loaded session from file: ${file.name}`);
                } catch (err) { alert('Invalid session file format.'); }
                loadFileInput.value = '';
            };
            reader.readAsText(file);
        });

        async function exportDataUrlAsMp3(dataUrl, filename = "recording.mp3") {
            try {
                const response = await fetch(dataUrl);
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                const channels = audioBuffer.numberOfChannels;
                const sampleRate = audioBuffer.sampleRate;
                const samples = audioBuffer.getChannelData(0);
                
                const buffer16 = new Int16Array(samples.length);
                for (let i = 0; i < samples.length; i++) {
                    let s = Math.max(-1, Math.min(1, samples[i]));
                    buffer16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }

                const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 320);
                const mp3Data = [];
                const sampleBlockSize = 1152;

                for (let i = 0; i < buffer16.length; i += sampleBlockSize) {
                    let sampleChunk = buffer16.subarray(i, i + sampleBlockSize);
                    let mp3buf = mp3encoder.encodeBuffer(sampleChunk);
                    if (mp3buf.length > 0) mp3Data.push(mp3buf);
                }
                let mp3buf = mp3encoder.flush();
                if (mp3buf.length > 0) mp3Data.push(new Int8Array(mp3buf));

                const blob = new Blob(mp3Data, { type: 'audio/mp3' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = filename; a.click();
                URL.revokeObjectURL(url);
            } catch(e) { console.error("MP3 Encoding failed", e); }
        }

        class ToneUnit {
            constructor(freq = 416, type = 'sine', gainVal = 0.2, shouldPlay = false) {
                this.freq = freq; this.type = type; this.gainVal = gainVal;
                this.isPlaying = false; this.osc = null; this.gain = null;
                this.shouldPlay = shouldPlay;
                this.createDOM();
            }
            createDOM() {
                this.row = document.createElement('div');
                this.row.className = 'tone-row';

                this.select = document.createElement('select');
                ['sine', 'square', 'sawtooth', 'triangle'].forEach(t => {
                    let opt = document.createElement('option');
                    opt.value = t; opt.textContent = t.toUpperCase().substring(0,3);
                    if(t === this.type) opt.selected = true;
                    this.select.appendChild(opt);
                });
                this.select.addEventListener('change', e => { 
                    this.type = e.target.value; 
                    if(this.isPlaying && this.osc) this.osc.type = this.type; 
                    logAction(`Changed tone waveform to ${this.type.toUpperCase()}`);
                });

                let box = document.createElement('div');
                box.className = 'freq-box';
                this.slider = document.createElement('input');
                this.slider.type = 'range'; this.slider.min = '0.01'; this.slider.max = '30000'; this.slider.step = '0.01'; this.slider.value = this.freq;
                
                this.input = document.createElement('input');
                this.input.type = 'number'; this.input.min = '0.01'; this.input.max = '30000'; this.input.step = '0.01'; this.input.value = this.freq;

                this.input.addEventListener('wheel', e => {
                    e.preventDefault();
                    let stepVal = e.shiftKey ? 10 : (e.altKey ? 0.1 : 1);
                    let cur = parseFloat(this.input.value) || 0;
                    let newVal = e.deltaY < 0 ? cur + stepVal : cur - stepVal;
                    newVal = Math.max(0.01, Math.min(30000, newVal));
                    this.input.value = newVal.toFixed(2);
                    this.updateFrequency(newVal);
                });

                this.slider.addEventListener('input', e => { 
                    this.updateFrequency(parseFloat(e.target.value)); 
                    logAction(`Adjusted tone frequency to ${this.freq.toFixed(2)} Hz`);
                });
                this.input.addEventListener('input', e => {
                    let v = parseFloat(e.target.value);
                    if(!isNaN(v)) {
                        this.updateFrequency(v);
                        logAction(`Typed tone frequency to ${this.freq.toFixed(2)} Hz`);
                    }
                });

                box.appendChild(this.slider); box.appendChild(this.input);

                this.vol = document.createElement('input');
                this.vol.type = 'range'; this.vol.min = '0'; this.vol.max = '1'; this.vol.step = '0.01'; this.vol.value = this.gainVal;
                this.vol.addEventListener('input', e => {
                    this.gainVal = parseFloat(e.target.value);
                    if(this.isPlaying && this.gain && audioCtx) {
                        this.gain.gain.setValueAtTime(this.gainVal, audioCtx.currentTime);
                    }
                    logAction(`Adjusted tone volume gain to ${Math.round(this.gainVal * 100)}%`);
                });

                this.btn = document.createElement('button');
                this.btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
                this.btn.addEventListener('click', () => {
                    if(this.isPlaying) {
                        this.stop();
                        logAction('Stopped individual tone generator');
                    } else {
                        this.start();
                        logAction(`Started tone generator at ${this.freq.toFixed(2)} Hz`);
                    }
                });

                this.del = document.createElement('button');
                this.del.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
                this.del.className = 'secondary';
                this.del.addEventListener('click', () => {
                    if(confirm("Are you sure you want to delete this tone generator?")) {
                        this.stop(); 
                        this.row.remove(); 
                        tones.splice(tones.indexOf(this), 1);
                        logAction('Deleted tone generator row');
                    }
                });

                this.row.appendChild(this.select);
                this.row.appendChild(box);
                this.row.appendChild(this.vol);
                this.row.appendChild(this.btn);
                this.row.appendChild(this.del);
                toneList.appendChild(this.row);

                setTimeout(() => { this.input.focus(); this.input.select(); }, 50);
                if (this.shouldPlay) this.start();
            }

            updateFrequency(val) {
                this.freq = Math.max(0.01, Math.min(30000, val));
                this.slider.value = this.freq;
                this.input.value = this.freq;
                if(this.isPlaying && this.osc && audioCtx) {
                    try { this.osc.frequency.setValueAtTime(this.freq, audioCtx.currentTime); } catch(e) {}
                }
            }

            start() {
                if(!isAudioInit) initAudioContext();
                if(audioCtx.state === 'suspended') audioCtx.resume().then(() => updateMasterToggleUI());
                this.stop();

                this.osc = audioCtx.createOscillator();
                this.gain = audioCtx.createGain();
                this.osc.type = this.type;
                this.osc.frequency.setValueAtTime(this.freq, audioCtx.currentTime);
                this.gain.gain.setValueAtTime(this.gainVal, audioCtx.currentTime);
                this.osc.connect(this.gain);
                this.gain.connect(synthBus);
                this.osc.start();
                this.isPlaying = true;
                this.btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>';
            }

            stop() {
                if(this.osc) { try { this.osc.stop(); this.osc.disconnect(); } catch(e){} this.osc = null; }
                if(this.gain) { try { this.gain.disconnect(); } catch(e){} this.gain = null; }
                this.isPlaying = false;
                this.btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
            }
        }

        function addToneRow(freq, type, gain, shouldPlay = true) {
            tones.push(new ToneUnit(freq, type, gain, shouldPlay));
        }

        addToneBtn.addEventListener('click', () => {
            addToneRow(416, 'sine', 0.15, true);
            logAction('Added a new tone generator row');
        });

        canvasContainer.addEventListener('click', (e) => {
            let rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            if (x < 0 || x > rect.width || y < 0 || y > rect.height) return;

            let freqRatio = x / rect.width;
            let dbRatio = 1 - (y / rect.height);
            let freq = freqRatio * 30000;
            let db = -90 + (dbRatio * 90);

            markers.push({ freq: freq, db: db, xRatio: freqRatio });
            renderMarkers();
            logAction(`Placed spectrometer marker at ${freq.toFixed(2)} Hz, ${db.toFixed(1)} dB`);
        });

        clearMarkersBtn.addEventListener('click', () => {
            if(markers.length > 0 && confirm("Are you sure you want to clear all spectrometer markers?")) {
                markers = [];
                renderMarkers();
                logAction('Cleared all spectrometer markers');
            }
        });

        function renderMarkers() {
            if (markers.length === 0) {
                markersList.innerHTML = `<div style="color: var(--text-muted); font-size:calc(9px * var(--ui-scale)); text-align:center; margin-top:10px;">No spectrometer markers placed.</div>`;
                return;
            }
            markersList.innerHTML = '';
            markers.forEach((m, idx) => {
                let row = document.createElement('div');
                row.className = 'marker-row';
                
                let info = document.createElement('div');
                info.className = 'marker-info';
                info.innerHTML = `<span>#${idx + 1}: ${m.freq.toFixed(1)} Hz | ${m.db.toFixed(1)} dB</span>`;
                row.appendChild(info);

                let btnGroup = document.createElement('div');
                btnGroup.className = 'compact-group';

                let addToneFromMarker = document.createElement('button');
                addToneFromMarker.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>';
                addToneFromMarker.className = 'secondary';
                addToneFromMarker.title = 'Add Tone at this Frequency';
                addToneFromMarker.addEventListener('click', () => {
                    addToneRow(m.freq, 'sine', 0.2, true);
                    logAction(`Added tone generator at marker frequency ${m.freq.toFixed(2)} Hz`);
                });

                let removeBtn = document.createElement('button');
                removeBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
                removeBtn.className = 'secondary';
                removeBtn.style.borderColor = 'var(--accent-red)';
                removeBtn.style.color = 'var(--accent-red)';
                removeBtn.addEventListener('click', () => {
                    if(confirm(`Are you sure you want to delete marker line #${idx + 1} (${m.freq.toFixed(1)} Hz)?`)) {
                        markers.splice(idx, 1);
                        renderMarkers();
                        logAction(`Removed marker #${idx + 1}`);
                    }
                });

                btnGroup.appendChild(addToneFromMarker);
                btnGroup.appendChild(removeBtn);
                row.appendChild(btnGroup);
                markersList.appendChild(row);
            });
        }

        let synthDestStream = null;
        let isRecordingSynth = false;
        let synthRecorderNode = null;

        recTakeBtn.addEventListener('click', () => {
            if(!isAudioInit) initAudioContext();
            
            if(!synthRecorderNode) {
                synthRecorderNode = audioCtx.createMediaStreamDestination();
                synthBus.connect(synthRecorderNode);
                synthDestStream = synthRecorderNode.stream;
            }

            if(!isRecordingSynth) {
                synthRecordedChunks = [];
                synthMediaRecorder = new MediaRecorder(synthDestStream);
                synthMediaRecorder.ondataavailable = e => synthRecordedChunks.push(e.data);
                synthMediaRecorder.onstop = () => {
                    let blob = new Blob(synthRecordedChunks, { type: 'audio/webm' });
                    let reader = new FileReader();
                    reader.onload = function(e) { addTakeUI(e.target.result, synthTakes, synthTakesList, 'Synth Take', true); };
                    reader.readAsDataURL(blob);
                };
                synthMediaRecorder.start();
                isRecordingSynth = true;
                recTakeBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg> Stop';
                recTakeBtn.style.backgroundColor = 'var(--accent-yellow)';
                logAction('Started recording Synth loops');
            } else {
                synthMediaRecorder.stop();
                isRecordingSynth = false;
                recTakeBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3" fill="currentColor"></circle></svg> Rec';
                recTakeBtn.style.backgroundColor = 'var(--accent-red)';
                logAction('Stopped and saved Synth loop recording');
            }
        });

        let isRecordingMic = false;

        recMicTakeBtn.addEventListener('click', async () => {
            if(!isAudioInit) initAudioContext();
            if(!isRecordingMic) {
                try {
                    let stream = micStream || await navigator.mediaDevices.getUserMedia({ audio: true });
                    micRecordedChunks = [];
                    let options = { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 320000 };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { audioBitsPerSecond: 320000 };

                    micMediaRecorder = new MediaRecorder(stream, options);
                    micMediaRecorder.ondataavailable = e => micRecordedChunks.push(e.data);
                    micMediaRecorder.onstop = () => {
                        let blob = new Blob(micRecordedChunks, { type: 'audio/webm' });
                        let reader = new FileReader();
                        reader.onload = function(e) { addTakeUI(e.target.result, micTakes, micTakesList, 'Mic Take', false); };
                        reader.readAsDataURL(blob);
                    };
                    micMediaRecorder.start();
                    isRecordingMic = true;
                    recMicTakeBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg> Stop';
                    recMicTakeBtn.style.backgroundColor = 'var(--accent-yellow)';
                    logAction('Started recording Microphone take');
                } catch(e) { alert('Mic access denied or configuration error.'); }
            } else {
                micMediaRecorder.stop();
                isRecordingMic = false;
                recMicTakeBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3" fill="currentColor"></circle></svg> Rec Mic';
                recMicTakeBtn.style.backgroundColor = 'var(--accent-red)';
                logAction('Stopped and saved Microphone take recording');
            }
        });

        function addTakeUI(dataUrl, takesArray, containerEl, labelPrefix, isSynth) {
            if(takesArray.length === 0) containerEl.innerHTML = '';
            let takeId = takesArray.length + 1;
            let audioEl = new Audio(dataUrl);
            audioEl.loop = true;
            let sourceNode = null;
            
            takesArray.push({ name: `${labelPrefix} ${takeId}`, dataUrl: dataUrl });

            let row = document.createElement('div');
            row.className = 'take-row';
            
            let takeInfo = document.createElement('div');
            takeInfo.className = 'take-info';
            takeInfo.innerHTML = `<span>${labelPrefix} ${takeId}</span>`;

            let timerSpan = document.createElement('span');
            timerSpan.className = 'take-timer';
            timerSpan.textContent = "00:00";
            takeInfo.appendChild(timerSpan);
            row.appendChild(takeInfo);
            
            let btnGroup = document.createElement('div');
            btnGroup.className = 'compact-group';

            let playBtn = document.createElement('button');
            playBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
            playBtn.className = 'secondary';

            let loopItemRef = { audio: audioEl, playBtn: playBtn, timer: timerSpan, sourceNode: sourceNode, isSynth: isSynth };
            activeLoopElements.push(loopItemRef);

            audioEl.addEventListener('loadedmetadata', () => {
                if(!isNaN(audioEl.duration) && audioEl.duration !== Infinity) timerSpan.textContent = formatTime(audioEl.duration);
            });

            audioEl.addEventListener('timeupdate', () => {
                if (!audioEl.paused) timerSpan.textContent = `${formatTime(audioEl.currentTime)} / ${formatTime(audioEl.duration || 0)}`;
            });

            playBtn.addEventListener('click', () => {
                if(audioEl.paused) { 
                    if (!loopItemRef.sourceNode && audioCtx) {
                        loopItemRef.sourceNode = audioCtx.createMediaElementSource(audioEl);
                        loopItemRef.sourceNode.connect(loopBus);
                    }
                    audioEl.play(); 
                    playBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>'; 
                    playBtn.style.color = 'var(--accent-red)';
                    logAction(`Started playing loop: ${labelPrefix} ${takeId}`);
                } else { 
                    audioEl.pause(); 
                    audioEl.currentTime = 0; 
                    playBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>'; 
                    playBtn.style.color = 'var(--accent-yellow)'; 
                    timerSpan.textContent = formatTime(audioEl.duration || 0);
                    logAction(`Stopped playing loop: ${labelPrefix} ${takeId}`);
                }
            });

            audioEl.addEventListener('ended', () => {
                playBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
                playBtn.style.color = 'var(--accent-yellow)';
                timerSpan.textContent = formatTime(audioEl.duration || 0);
            });

            let removeBtn = document.createElement('button');
            removeBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
            removeBtn.className = 'secondary';
            removeBtn.style.borderColor = 'var(--accent-red)';
            removeBtn.style.color = 'var(--accent-red)';
            removeBtn.addEventListener('click', () => {
                if(confirm(`Are you sure you want to delete ${labelPrefix} ${takeId}?`)) {
                    audioEl.pause();
                    row.remove();
                    let idx = -1;
                    for(let i=0; i<takesArray.length; i++) {
                        if(takesArray[i].dataUrl === dataUrl) { idx = i; break; }
                    }
                    if(idx > -1) takesArray.splice(idx, 1);
                    
                    let refIdx = activeLoopElements.indexOf(loopItemRef);
                    if(refIdx > -1) activeLoopElements.splice(refIdx, 1);

                    if(takesArray.length === 0) {
                        containerEl.innerHTML = `<div style="color: var(--text-muted); font-size:calc(9px * var(--ui-scale)); text-align:center; margin-top:10px;">No ${labelPrefix.toLowerCase()} takes recorded.</div>`;
                    }
                    logAction(`Deleted take: ${labelPrefix} ${takeId}`);
                }
            });

            btnGroup.appendChild(playBtn);
            btnGroup.appendChild(removeBtn);
            row.appendChild(btnGroup);
            containerEl.appendChild(row);
        }

        function formatTime(seconds) {
            let mins = Math.floor(seconds / 60);
            let secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        micToggleBtn.addEventListener('click', async () => {
            if(!isAudioInit) initAudioContext();
            if(!isMicActive) {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    micSource = audioCtx.createMediaStreamSource(micStream);
                    
                    micAnalyser = audioCtx.createAnalyser();
                    micAnalyser.fftSize = 8192;
                    micSource.connect(micAnalyser);
                    
                    isMicActive = true;
                    micToggleBtn.style.borderColor = 'var(--accent-red)';
                    logAction('Enabled microphone active listening (spectrometer visualization only, no real-time playback)');
                } catch(e) { alert('Mic access denied.'); }
            } else {
                if(micStream) micStream.getTracks().forEach(t => t.stop());
                if(micSource) micSource.disconnect();
                isMicActive = false;
                micToggleBtn.style.borderColor = 'var(--accent-yellow)';
                logAction('Disabled microphone active listening');
            }
        });

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            let w = canvas.width = canvas.offsetWidth;
            let h = canvas.height = canvas.offsetHeight;
            canvasCtx.fillStyle = '#020202';
            canvasCtx.fillRect(0, 0, w, h);

            if(!analyser || !isAudioInit) return;
            let bufferLength = analyser.frequencyBinCount;
            let data = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(data);

            if(isMicActive && micAnalyser) {
                let micData = new Uint8Array(bufferLength);
                micAnalyser.getByteFrequencyData(micData);
                for(let i = 0; i < bufferLength; i++) {
                    data[i] = Math.max(data[i], micData[i]);
                }
            }

            let nyquist = audioCtx.sampleRate / 2;
            let maxIndexToCheck = Math.floor((30000 / nyquist) * bufferLength);
            maxIndexToCheck = Math.min(maxIndexToCheck, bufferLength);

            let maxVal = 0;
            let maxIndex = 0;
            for(let i = 0; i < maxIndexToCheck; i++) {
                if(data[i] > maxVal) { maxVal = data[i]; maxIndex = i; }
            }
            let peakFreq = (maxIndex * nyquist) / bufferLength;
            peakFreqDisplay.textContent = `PEAK: ${peakFreq.toFixed(2)} Hz`;

            canvasCtx.strokeStyle = '#0e0e0e';
            canvasCtx.lineWidth = 1;
            for(let i = 1; i < 4; i++) {
                let y = (h / 4) * i;
                canvasCtx.beginPath(); canvasCtx.moveTo(0, y); canvasCtx.lineTo(w, y); canvasCtx.stroke();
            }

            let barW = w / maxIndexToCheck;
            let x = 0;
            for(let i = 0; i < maxIndexToCheck; i++) {
                let barH = (data[i] / 255) * h;
                let redVal = Math.min(255, barH * 2);
                canvasCtx.fillStyle = `rgb(${redVal}, ${Math.floor(160 - (barH/2))}, 20)`;
                canvasCtx.fillRect(x, h - barH, Math.max(1, barW), barH);
                x += barW;
                if(x > w) break;
            }

            // Draw Markers
            markers.forEach((m, idx) => {
                let mx = m.xRatio * w;
                let my = h - ((m.db + 90) / 90) * h;

                // Vertical line
                canvasCtx.strokeStyle = '#cc9900';
                canvasCtx.lineWidth = 1;
                canvasCtx.setLineDash([2, 2]);
                canvasCtx.beginPath();
                canvasCtx.moveTo(mx, 0);
                canvasCtx.lineTo(mx, h);
                canvasCtx.stroke();
                canvasCtx.setLineDash([]);

                // Marker point
                canvasCtx.fillStyle = '#cc1111';
                canvasCtx.fillRect(mx - 2, my - 2, 5, 5);

                // Label
                canvasCtx.fillStyle = '#e0e0e0';
                canvasCtx.font = '8px monospace';
                canvasCtx.fillText(`#${idx + 1}: ${m.freq.toFixed(0)}Hz`, mx + 4, Math.max(10, my - 4));
            });
        }
    </script>
